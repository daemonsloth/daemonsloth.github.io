<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Public profile for Siddharth Maurya, systems engineer and researcher." />
    <title>Sid</title>
    <link href="logo.png" rel="shortcut icon" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <a class="brand" href="#home" aria-label="Go to home"></a>
        <p class="eyebrow"></p>
        <nav aria-label="Profile sections"></nav>
        <div class="sidebar-footer">
          <span class="status-dot"></span>
          <span class="sidebar-availability"></span>
          <button class="sidebar-reopen" type="button">↵ reopen terminal</button>
        </div>
      </aside>

      <section class="terminal-wrap">
        <header class="topbar">
          <div class="window-controls" aria-label="Window controls">
            <button class="window-control close" type="button" aria-label="Enter sleep mode" title="Enter sleep mode"></button>
            <button class="window-control minimize" type="button" aria-label="Close terminal" title="Close terminal"></button>
            <button class="window-control maximize" type="button" aria-label="Enter fullscreen" title="Enter fullscreen"></button>
          </div>
          <p><span></span></p>
          <button class="menu-toggle" aria-label="Open navigation">☰</button>
        </header>

        <div class="terminal" id="terminal" aria-live="polite"></div>

        <form class="command-form" id="commandForm">
          <label for="commandInput"><span class="prompt"></span><span class="path">:~$</span></label>
          <input id="commandInput" autocomplete="off" aria-label="Enter a command" />
          <button type="submit" aria-label="Run command">↵</button>
        </form>
      </section>

      <button class="sleep-screen" type="button" aria-label="Restore terminal">
        <span class="status-dot"></span>
        <span><b></b><small></small></span>
      </button>
    </main>

    <script src="profile-content.js"></script>
    <script src="app.js"></script>
  </body>
</html>
